<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scarlet Frontier Log v0.7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=070" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="kicker">Scarlet Frontier</div>
        <h1>Боевой пульт <span>v0.7</span></h1>
      </div>
      <div class="top-actions">
        <button class="ghost" id="import-btn">Загрузить персонажа</button>
        <input id="file-input" type="file" accept=".json,application/json" hidden />
        <button class="ghost" id="new-char-btn">+ Пустой</button>
        <button class="ghost" id="toggle-log-btn">Журнал</button>
        <div class="status" id="net-status">подключение…</div>
      </div>
    </header>

    <section class="main-grid">
      <section class="panel controls">
        <div class="char-row">
          <label class="field char-select">
            <span>Персонаж</span>
            <select id="char-select"></select>
          </label>
          <label class="field char-name">
            <span>Имя</span>
            <input id="char-name" placeholder="Полли" />
          </label>
          <div class="res-track">
            <span>ОТП</span>
            <button class="round" data-res="otp" data-delta="-1">−</button>
            <strong id="otp-val">0</strong><em id="otp-max">/3</em>
            <button class="round" data-res="otp" data-delta="1">+</button>
          </div>
          <div class="res-track">
            <span>ОД</span>
            <button class="round" data-res="od" data-delta="-1">−</button>
            <strong id="od-val">3</strong>
            <button class="round" data-res="od" data-delta="1">+</button>
          </div>
          <div class="res-track">
            <span>SP</span>
            <button class="round" data-res="sp" data-delta="-1">−</button>
            <strong id="sp-val">0</strong>
            <button class="round" data-res="sp" data-delta="1">+</button>
          </div>
        </div>

        <div class="action-row">
          <label class="field skill-field">
            <span>Проверка</span>
            <select id="skill-select"></select>
          </label>
          <label class="field mini"><span>TN</span><select id="tn"><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option></select></label>
          <div class="stepper"><span>Преим.</span><button data-step="adv" data-delta="-1">−</button><strong id="adv-val">0</strong><button data-step="adv" data-delta="1">+</button></div>
          <div class="stepper"><span>Помех.</span><button data-step="dis" data-delta="-1">−</button><strong id="dis-val">0</strong><button data-step="dis" data-delta="1">+</button></div>
          <label class="check"><input id="insurance" type="checkbox"> страховка</label>
          <label class="check"><input id="zero" type="checkbox"> зеро</label>
          <button class="primary" id="roll-skill-btn">БРОСОК</button>
        </div>

        <div class="action-row damage-row">
          <label class="field skill-field"><span>Урон</span><select id="weapon-select"></select></label>
          <label class="field mini"><span>Боеприпас</span><select id="ammo-type"><option value="light">Лёгк.</option><option value="ap">Брон.</option><option value="exp">Эксп.</option></select></label>
          <label class="field mini"><span>SP цели</span><input id="target-sp" type="number" min="0" max="99" value="0"></label>
          <button class="primary damage" id="roll-damage-btn">УРОН</button>
          <form class="chat-form" id="chat-form">
            <input id="chat-input" placeholder="Короткое сообщение в ленту…" autocomplete="off">
            <button class="ghost" type="submit">Отпр.</button>
          </form>
        </div>
      </section>

      <section class="panel latest" id="latest-card">
        <div class="latest-label">Последний результат</div>
        <div class="latest-title">Пока нет событий</div>
        <div class="latest-body">Загрузи персонажа JSON или создай пустого. Броски появятся здесь у всех, у кого открыт Scarlet Log.</div>
      </section>
    </section>

    <section class="log-drawer" id="log-drawer" hidden>
      <div class="drawer-head">
        <b>Журнал комнаты</b>
        <span>новые сверху</span>
        <button class="ghost" id="export-log-btn">Скачать .txt</button>
        <button class="ghost" id="clear-local-btn">Очистить у себя</button>
      </div>
      <div class="log" id="log"></div>
    </section>
  </main>
  <script type="module" src="main.js?v=070"></script>
</body>
</html>
